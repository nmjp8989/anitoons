name: Generate mission dialogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'missions/mission.json'
      - 'missions/adventures/*.json'
      - 'tools/genaudio.py'
      - 'tools/build_mission_audio.py'
      - 'tools/fetch_voice_references.py'
      - 'tools/requirements-audio.txt'
      - '.github/workflows/mission-audio.yml'

permissions:
  contents: write

concurrency:
  group: mission-dialogue
  cancel-in-progress: false

jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tooling
        run: python -m pip install -r tools/requirements-audio.txt
      - name: Check credentials
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          VOICE_REFERENCES_URL: ${{ secrets.VOICE_REFERENCES_URL }}
        run: |
          test -n "$MIMO_API_KEY" || { echo 'Add repository secret MIMO_API_KEY'; exit 1; }
          test -n "$VOICE_REFERENCES_URL" || { echo 'Add repository secret VOICE_REFERENCES_URL'; exit 1; }
      - name: Download private reference samples
        env:
          VOICE_REFERENCES_URL: ${{ secrets.VOICE_REFERENCES_URL }}
        run: python tools/fetch_voice_references.py
      - name: Validate mission batch
        run: python tools/build_mission_audio.py --dry-run
      - name: Generate only missing or changed lines
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: python tools/build_mission_audio.py
      - name: Preserve clips for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-dialogue
          path: missions/audio/
          if-no-files-found: ignore
      - name: Commit generated dialogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missions/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate mission voice clips'
          git push origin HEAD:main
