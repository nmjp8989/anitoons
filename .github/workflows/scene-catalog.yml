name: Update SVG scene catalogue
on:
  push:
    branches: [main]
    paths: ['scenes/*.svg', 'tools/build_scene_catalog.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: scene-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_scene_catalog.py
      - name: Save catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenes/catalog.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update SVG scene catalogue'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
