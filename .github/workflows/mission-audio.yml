name: Generate mission dialogue

on:
  workflow_dispatch:
    inputs:
      mission:
        description: Mission to voice
        type: choice
        options: [moon-lantern, last-delivery, rooftop-kite, missing-key, all]
        default: last-delivery
  push:
    branches: [main]
    paths:
      - 'missions/mission.json'
      - 'missions/adventures/*.json'
      - 'tools/genaudio.py'
      - 'tools/build_mission_audio.py'
      - 'tools/requirements-audio.txt'
      - 'voices.json'
      - '*_sample.wav'
      - '*_sample.mp3'
      - '.github/workflows/mission-audio.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: mission-dialogue
  cancel-in-progress: false

jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tooling
        run: python -m pip install -r tools/requirements-audio.txt
      - name: Check credentials
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: test -n "$MIMO_API_KEY" || { echo 'Add repository secret MIMO_API_KEY'; exit 1; }
      - name: Select mission and validate references
        env:
          SELECTED_MISSION: ${{ inputs.mission || 'all' }}
        run: |
          case "$SELECTED_MISSION" in
            all) echo 'MISSION_FILE=' >> "$GITHUB_ENV" ;;
            missing-key) echo 'MISSION_FILE=missions/mission.json' >> "$GITHUB_ENV" ;;
            moon-lantern|last-delivery|rooftop-kite) echo "MISSION_FILE=missions/adventures/$SELECTED_MISSION.json" >> "$GITHUB_ENV" ;;
            *) echo 'Unknown mission'; exit 1 ;;
          esac
      - name: Generate only missing or changed lines
        id: generate
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          if [ -n "$MISSION_FILE" ]; then
            python tools/build_mission_audio.py --mission "$MISSION_FILE" --dry-run
            python tools/build_mission_audio.py --mission "$MISSION_FILE"
          else
            python tools/build_mission_audio.py --dry-run --max-new-lines 200
            python tools/build_mission_audio.py --max-new-lines 200
          fi
      - name: Preserve clips for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-dialogue
          path: missions/audio/
          if-no-files-found: ignore
      - name: Commit generated dialogue (including completed clips after failure)
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        run: |
          if [ ! -d missions/audio ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missions/audio/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate mission voice clips'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild with stored audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
